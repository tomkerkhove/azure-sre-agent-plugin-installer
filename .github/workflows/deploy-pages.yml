name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Application Insights (ingestion connection string)
        env:
          CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: |
          # Write-only ingestion connection string. Telemetry stays disabled when
          # the secret is not configured (for example on forks).
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const connectionString = process.env.CONNECTION_STRING ?? "";
            const config = {
              telemetry: {
                connectionString,
                cloudRole: "sre-agent-plugin-installer",
              },
            };
            writeFileSync(
              "assets/config.js",
              `window.SITE_CONFIG = ${JSON.stringify(config, null, 2)};\n`
            );
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          # Preserve PR preview directories deployed to the pr-preview/ folder
          # of this same branch by pr-preview.yml.
          keep_files: true
