name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build site
        run: |
          npm ci
          npm run build

      - name: Configure Microsoft Entra authentication
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          node -e 'const fs = require("node:fs"); const config = { clientId: process.env.AZURE_CLIENT_ID || "", tenantId: process.env.AZURE_TENANT_ID || "organizations", dataPlaneScope: "https://azuresre.dev/.default" }; fs.writeFileSync("assets/config.js", `window.SRE_AGENT_INSTALLER_CONFIG = Object.freeze(${JSON.stringify(config)});\n`);'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
