name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site
        run: |
          npm ci
          npm run build
          rm -rf node_modules

      - name: Configure site
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const installerConfig = {
              clientId: process.env.AZURE_CLIENT_ID || "",
              tenantId: process.env.AZURE_TENANT_ID || "organizations",
              dataPlaneScope: "https://azuresre.dev/.default",
            };
            const siteConfig = {
              telemetry: {
                connectionString: process.env.CONNECTION_STRING || "",
                cloudRole: "sre-agent-plugin-installer",
              },
            };
            writeFileSync(
              "assets/config.js",
              `window.SRE_AGENT_INSTALLER_CONFIG = Object.freeze(${JSON.stringify(installerConfig, null, 2)});\n` +
                `window.SITE_CONFIG = ${JSON.stringify(siteConfig, null, 2)};\n`
            );
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          # Preserve PR preview directories deployed to the pr-preview/ folder
          # of this same branch by pr-preview.yml.
          keep_files: true
